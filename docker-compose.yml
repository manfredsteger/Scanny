services:
  scanny:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanny
    restart: unless-stopped
    ports:
      - "3004:3000"
    volumes:
      - ./data:/app/data
      - ${SCANNY_PATH:?Bitte SCANNY_PATH in .env setzen}:/app/scanny
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
      - SCANNY_DIR=/app/scanny
      - WATCH_POLLING=${WATCH_POLLING:-true}
      - SCANNY_HOST_PATH=${SCANNY_PATH}
